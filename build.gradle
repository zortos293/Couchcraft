plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

base {
	archivesName = project.archives_base_name
}

loom {
	mods {
		"couchcraft" {
			sourceSet sourceSets.main
		}
	}

	runs {
		// Couchcraft is a client mod; a dedicated server run is not useful.
		remove server

		client {
			// ./gradlew runClient -PcouchGuests=1 -PcouchWorld="New World"
			if (project.hasProperty("couchGuests")) {
				vmArg "-Dcouchcraft.autoGuests=${project.property('couchGuests')}"
			}
			if (project.hasProperty("couchDev")) {
				// Opens/creates the world named by couchDev and runs the scripted capture session.
				vmArg "-Dcouchcraft.devWorld=${project.property('couchDev')}"
				vmArg "-Dcouchcraft.devScript=true"
				programArgs "--width", "1600", "--height", "900"
			}
			if (project.hasProperty("couchWorld")) {
				programArgs "--quickPlaySingleplayer", project.property("couchWorld").toString()
			}
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
	it.options.encoding = "UTF-8"
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}
